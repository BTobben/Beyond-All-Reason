# Experimental BAR / RecoilEngine OpenGL 4.1 Core profile.
# Enhanced GL4 renderer features stay disabled; granular UBO support remains
# available through Platform.glSupportUniformBuffers.
ForceCoreContext=1
GLContextMajorVersion=4
GLContextMinorVersion=1
ForceDisableGL4=1
ForceDisablePersistentMapping=1
RenderingBackend=opengl
OpenGLFeatureLevel=gl41
# Capture each distinct OpenGL driver diagnostic once in a small, shareable
# report instead of repeating it in the terminal and the full infolog.
DebugGL=1
DebugGLUniqueOnly=1
DebugGLLogToInfolog=0
DebugGLCompatibilityReport=1
DebugGLStacktraces=0
DebugGLReportGroups=0
MSAALevel=0
Fullscreen=0
WindowBorderless=0
UseFontConfigSystemFonts=0
