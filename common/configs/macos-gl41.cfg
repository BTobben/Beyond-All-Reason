# Experimental BAR / RecoilEngine OpenGL 4.1 Core profile.
# Enhanced GL4 renderer features stay disabled; granular UBO support remains
# available through Platform.glSupportUniformBuffers.
ForceCoreContext=1
GLContextMajorVersion=4
GLContextMinorVersion=1
ForceDisableGL4=1
ForceDisablePersistentMapping=1
MSAALevel=0
Fullscreen=0
WindowBorderless=0
UseFontConfigSystemFonts=0
